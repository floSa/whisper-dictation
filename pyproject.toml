[project]
name = "whisper-dictation"
version = "0.1.0"
description = "Client de dictée vocale globale avec raccourci clavier connecté à un serveur Whisper local partagé"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Florian", email = "florian.horellou@gmail.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pyperclip>=1.8.2",
    "sounddevice>=0.4.6; sys_platform == 'win32'",
    "pynput>=1.7.6; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-mock>=3.14.0",
    "black>=24.3.0",
]

[project.scripts]
whisper-dictation = "whisper_dictation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
